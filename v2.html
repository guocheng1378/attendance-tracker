<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຕາຕະລາງເຊັນເຂົ້າ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f7fa;color:#333;max-width:480px;margin:0 auto;padding:16px}
.hdr{text-align:center;padding:20px 0}
.hdr h1{font-size:20px;margin-bottom:4px}
.hdr p{font-size:13px;color:#888}
.lang{position:fixed;top:12px;right:12px;background:#2563eb;color:white;border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;z-index:99;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.dnav{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}
.dnav button{background:white;border:1px solid #ddd;border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.dnav .dtxt{text-align:center;min-width:120px}
.dnav .dtxt b{font-size:16px;display:block}
.dnav .dtxt small{color:#2563eb;font-size:12px}
.sbar{display:flex;justify-content:space-around;background:white;border-radius:12px;padding:12px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sbar span{font-size:13px;font-weight:600}
.wlist{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.witem{display:flex;align-items:center;background:white;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:all .2s}
.witem:active{transform:scale(.98);background:#f0f7ff}
.witem .wi{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:12px}
.witem .wn{flex:1}
.witem .wn b{display:block;font-size:15px}
.witem .wn small{color:#888;font-size:12px}
.witem .ws{text-align:right}
.witem .ws b{display:block;font-size:18px}
.witem .ws small{font-size:11px;color:#888}
.sn{background:#e8f5e9}
.sa{background:#fff3e0}
.sh{background:#e3f2fd}
.st{background:#f5f5f5}
.abtn{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap;justify-content:center}
.abtn button{flex:1;min-width:100px;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.abtn .g{background:#22c55e;color:white}
.abtn .b{background:#3b82f6;color:white}
.abtn .o{background:#f59e0b;color:white}
.abtn .r{background:#ef4444;color:white}
.abtn .d{background:#6b7280;color:white}
.sts{position:fixed;bottom:0;left:0;right:0;background:white;padding:8px 16px;font-size:12px;color:#888;text-align:center;border-top:1px solid #eee;max-width:480px;margin:0 auto;z-index:10}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal .box{background:white;border-radius:16px;padding:20px;width:90%;max-width:360px}
.modal h3{margin-bottom:12px;font-size:16px}
.modal .fitem{display:flex;align-items:center;padding:10px;border-radius:8px;cursor:pointer}
.modal .fitem:active{background:#f0f7ff}
.modal .fitem .fi{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:10px}
.modal .fitem .fn{font-weight:600;font-size:14px}
.modal .close{margin-top:12px;width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;background:white;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="hdr"><h1 id="T1">📋 ຕາຕະລາງເຊັນເຂົ້າ</h1><p id="T2"></p></div>
<button class="lang" onclick="tgLang()" id="LB"></button>
<div class="dnav"><button onclick="pd()">◀</button><div class="dtxt"><b id="DT"></b><small id="DD"></small></div><button onclick="nd()">▶</button></div>
<div class="sbar"><span id="SF">-</span><span id="SA">-</span><span id="SH">-</span><span id="SN">-</span></div>
<div class="wlist" id="WL"></div>
<div class="abtn"><button class="g" onclick="dlLocal()" id="BB1">📥 备份</button><button class="b" onclick="toggleAutoSync()" id="BB2">☁️ 自动同步</button><button class="o" onclick="showEmpModal()" id="BB3">👤 切换员工</button><button class="r" onclick="showBkList()" id="BB4">📋 历史备份</button><button class="d" onclick="window.location.href='v2admin.html'" id="BB5">⚙️ 管理</button></div>
<div class="sts" id="ST"></div>
<div class="modal" id="EM"><div class="box"><h3 id="EMT">👤 ເລືອກພະນັກງານ</h3><div id="EL"></div><button class="close" onclick="closeEmpModal()" id="EMC">ປິດ</button></div></div>
<div class="modal" id="BK"><div class="box"><h3 id="BKT">📋 ປະຫັວດການສຳຮອງ</h3><div id="BL"></div><button class="close" onclick="closeBkList()" id="BKC">ປິດ</button></div></div>
<script>
var ghToken=localStorage.getItem('att_gh_token')||'';
var REPO='guocheng1378/attendance-tracker';
var API='https://api.github.com';
var RAW='https://raw.githubusercontent.com/'+REPO+'/main/';
var lang=localStorage.getItem('att_lang')||'lo';
var TXT={lo:{t1:'📋 ຕາຕະລາງເຊັນເຂົ້າ',t2:'ເລືອກວັນ ແລະ ກົດເຊັນ',tt:['✅ ສະເຊັນແລ້ວ','⏳ ກຳລັງດຳເນີນງານ...','❌ ບໍ່ມີຂໍ້ມູນ'],w:['ດີນ້ຳ','ງົວ','ງົວ2','ນ້ຳ'],ac:['✅ ເຊັນເຂົ້າ','🔄 ເປີດໂປດ','⏭️ ຂ້າມມື້ນີ້','↩️ ເປີດເຊັນຄືນ'],af:'⏳ ກຳລັງໂຫຼດ...',rl:'🔄 ກຳລັງໂຫຼດລາຍຊື່...',bk:'📋 ບ່ອນສຳຮອງ:',nb:'⚠️ ບໍ່ມີບ່ອນສຳຮອງ',rs:'🔄 ກຳລັງຟື້ນຟູ...',cn:'✅ ຟື້ນຟູສຳເລັດ',er:'❌ ມີຄວາມຜິດພາດ',syn:'☁️ ກຳລັງຊົງ...',sb:'✅ ຊົງສຳເລັດ',cf:'⚠️ ຍັງບໍ່ໄດ້ຕັ້ງ Token GitHub',tb:'🔄 ຕິດຕາມອັດຕໂມແຕ່ລະ',as:['⏸️ ຢຸດຕິດຕາມ','▶️ ເລີ່ມຕິດຕາມອັດຕໂມ'],nwd:'⚠️ ບໍ່ມີວັນໃດເລີຍ',nwe:'⚠️ ຍັງບໍ່ໄດ້ເລືອກພະນັກງານ',cnf:'✅ ເຊັນສຳເລັດ!',alr:'⚠️ ເຊັນແລ້ວມື້ນີ້'},en:{t1:'📋 Attendance Sheet',t2:'Select a day and sign in',tt:['✅ Signed in','⏳ Processing...','❌ No data'],w:['Noy','Cow','Cow2','Noy'],ac:['✅ Sign in','🔄 Open menu','⏭️ Skip today','↩️ Reopen sign-in'],af:'⏳ Loading...',rl:'🔄 Loading list...',bk:'📋 Backup slots:',nb:'⚠️ No backups yet',rs:'🔄 Restoring...',cn:'✅ Restored!',er:'❌ Error',syn:'☁️ Syncing...',sb:'✅ Synced!',cf:'⚠️ GitHub token not set',tb:'🔄 Auto sync every 30s',as:['⏸️ Stop auto sync','▶️ Start auto sync'],nwd:'⚠️ No dates available',nwe:'⚠️ No employee selected',cnf:'✅ Signed in!',alr:'⚠️ Already signed in today'}};
var EMP=JSON.parse(localStorage.getItem('emp')||'[]');
var allData=[];var ce=null;var fd=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function tgLang(){lang=lang==='lo'?'en':'lo';localStorage.setItem('att_lang',lang);ui();ls();}
function ui(){var t=TXT[lang];document.getElementById('LB').textContent=lang==='lo'?'EN':'LO';document.getElementById('T1').textContent=t.t1;document.getElementById('T2').textContent=t.t2;document.getElementById('BB1').textContent='📥 '+t.bk;document.getElementById('BB3').textContent='👤 '+t.ac[2];document.getElementById('BB5').textContent='⚙️ '+t.ac[1];}
function getDates(){var ds={};allData.forEach(function(r){ds[r.d]=1;});return Object.keys(ds).sort().reverse();}
var cdi=0;
function pd(){var ds=getDates();if(ds.length===0)return;cdi=Math.min(cdi+1,ds.length-1);rd();}
function nd(){var ds=getDates();if(ds.length===0)return;cdi=Math.max(cdi-1,0);rd();}
function rd(){var ds=getDates();if(ds.length===0){document.getElementById('DT').textContent='--';document.getElementById('DD').textContent='--';document.getElementById('WL').innerHTML='';return;}var d=ds[cdi];var dp=d.split('-');var mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];document.getElementById('DT').textContent=d;document.getElementById('DD').textContent=mn[parseInt(dp[1])-1]+' '+parseInt(dp[2]);var recs=allData.filter(function(r){return r.d===d;});var f=0,h=0,a=0;recs.forEach(function(r){if(r.s==='f')f++;else if(r.s==='h')h++;else if(r.s==='a')a++;});document.getElementById('SF').textContent='✅ '+f;document.getElementById('SA').textContent='❌ '+a;document.getElementById('SH').textContent='⚠️ '+h;document.getElementById('SN').textContent='📊 '+(f+h+a);var html='';EMP.forEach(function(e){var rec=recs.find(function(r){return r.w===e.id;});var cls=rec?(rec.s==='f'?'sn':rec.s==='h'?'sh':'sa'):'st';var sm=rec?(rec.s==='f'?'✅':rec.s==='h'?'⚠️':'❌'):'-';html+='<div class="witem '+cls+'" onclick="cs('+e.id+')"><div class="wi" style="background:'+(e.c||'#e0e0e0')+'">'+e.n.charAt(0)+'</div><div class="wn"><b>'+e.n+'</b><small>'+(e.z||'')+'</small></div><div class="ws"><b>'+sm+'</b></div></div>';});document.getElementById('WL').innerHTML=html;}
function ls(){var st=document.getElementById('ST');var t=TXT[lang];st.innerHTML=t.rl;fetch(RAW+'backup/attendance-'+fd()+'.json?='+Date.now())
.then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){allData=d;st.innerHTML='';rd();})
.catch(function(){st.innerHTML=t.er;});}
function cs(id){var t=TXT[lang];if(!id)return;var ds=getDates();if(ds.length===0){alert(t.nwd);return;}var d=ds[cdi];var ex=allData.find(function(r){return r.d===d&&r.w===id;});if(ex&&ex.s==='f'){alert(t.alr);return;}var nm=EMP.find(function(e){return e.id===id;});var n=nm?nm.n:'?',z=nm?nm.z:'';var idx=allData.findIndex(function(r){return r.d===d&&r.w===id;});if(idx>=0){allData[idx].s='f';allData[idx].t=new Date().toISOString();}else{allData.push({d:d,w:id,n:n,z:z,s:'f',t:new Date().toISOString()});}st.innerHTML=t.tt[0]+' '+n;setTimeout(function(){st.innerHTML='';},1500);rd();syncData();}
function syncData(){if(!ghToken)return;var st=document.getElementById('ST');st.innerHTML='☁️';var emp=JSON.parse(localStorage.getItem('emp')||'[]');var nmap={};emp.forEach(function(e){nmap[e.id]=e;});allData.forEach(function(r){if(r.w&&nmap[r.w]){r.n=nmap[r.w].n;r.z=nmap[r.w].z;}});var sha='';fetch(API+'/repos/'+REPO+'/contents/backup/attendance-'+fd()+'.json',{headers:{'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json'}})
.then(function(r){if(r.status===200)return r.json().then(function(d){sha=d.sha;return d;});return null;}).then(function(){return fetch(API+'/repos/'+REPO+'/contents/backup/attendance-'+fd()+'.json',{method:'PUT',headers:{'Authorization':'token '+ghToken,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({message:'auto: '+fd(),content:btoa(unescape(encodeURIComponent(JSON.stringify(allData,null,2)))),sha:sha,branch:'main'})});}).then(function(r){return r.json();}).then(function(d){st.innerHTML='☁️';setTimeout(function(){st.innerHTML='';},1000);}).catch(function(){st.innerHTML='';});}
function dlLocal(){var r=getRec();if(r.length===0){alert('No data');return;}
var b=new Blob([JSON.stringify(r,null,2)],{type:'application/json'});
var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='attendance_'+fd()+'.json';a.click();
var ws={};EMP.forEach(function(e){ws[e.id]={id:e.id,n:e.n,z:e.z,f:0,h:0,a:0};});
r.forEach(function(rec){if(rec.w&&ws[rec.w])ws[rec.w][rec.s]++;});
var summary={month:fd().substring(0,7),generated:new Date().toISOString(),employees:Object.values(ws).map(function(w){return{id:w.id,n:w.n,z:w.z,f:w.f,a:w.a,h:w.h,days:w.f+w.h*0.5};})};
var sb=new Blob([JSON.stringify(summary,null,2)],{type:'application/json'});
var sa=document.createElement('a');sa.href=URL.createObjectURL(sb);sa.download='wage_'+fd().substring(0,7).replace('-','_')+'.json';sa.click();}
function toggleAutoSync(){var t=TXT[lang];if(window._asi){clearInterval(window._asi);window._asi=null;alert(t.as[0]);}else{window._asi=setInterval(syncData,30000);alert(t.as[1]);}}
function showBkList(){var t=TXT[lang],st=document.getElementById('ST');st.innerHTML=t.bk;
fetch(API+'/repos/'+REPO+'/contents/backup',{headers:{'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json'}})
.then(function(r){return r.json();}).then(function(items){var box=document.getElementById('BL');var jsons=items.filter(function(f){return f.name.endsWith('.json');}).sort().reverse();
if(jsons.length===0){box.innerHTML='<div style="padding:8px;text-align:center;color:#888;font-size:12px">'+t.nb+'</div>';box.style.display='block';st.innerHTML='';return;}
var html='';jsons.forEach(function(f){var d=f.name.replace('attendance-','').replace('.json','');
html+='<div class="fitem"><div class="fi" style="background:#e3f2fd">📅</div><div class="fn">'+d+'</div><button class="rb" onclick="restoreBackup(\''+f.name+'\',\''+f.sha+'\')">'+t.rs+'</button></div>';});box.innerHTML=html;box.style.display='block';st.innerHTML='';})
.catch(function(){st.innerHTML=t.er;});}
function restoreBackup(name,sha){if(!confirm(TXT[lang].cnf))return;
var t=TXT[lang],st=document.getElementById('ST');st.innerHTML=t.rs;
fetch(RAW+'backup/'+name+'?t='+Date.now())
.then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(data){
localStorage.setItem('att2',JSON.stringify(data));allData=data;ls();
st.innerHTML='✅ '+data.length+' '+t.cn;
setTimeout(function(){st.innerHTML='';},3000);})
.catch(function(){st.innerHTML=t.er;});}
function showEmpModal(){var html='';EMP.forEach(function(e){html+='<div class="fitem" onclick="selectEmp('+e.id+')"><div class="fi" style="background:'+(e.c||'#e0e0e0')+'">'+e.n.charAt(0)+'</div><div class="fn">'+e.n+' ('+(e.z||'')+')</div></div>';});document.getElementById('EL').innerHTML=html;document.getElementById('EM').classList.add('show');}
function closeEmpModal(){document.getElementById('EM').classList.remove('show');}
function selectEmp(id){var nm=EMP.find(function(e){return e.id===id;});if(nm){localStorage.setItem('att_emp',nm.id);ce=nm;}closeEmpModal();ls();}
function closeBkList(){document.getElementById('BK').classList.remove('show');}
lang=localStorage.getItem('att_lang')||'lo';
ghToken=localStorage.getItem('att_gh_token')||'';
rd();ui();rl();ls();
</script>
</body>
</html>
