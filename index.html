<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບການເຊັກອິນ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="lang-bar">
            <button class="lang-btn active" data-lang="lo" onclick="setLang('lo')">ລາວ</button>
            <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
            <button class="token-btn" onclick="showTokenModal()">⚙️</button>
        </div>
        <div class="header">
            <h1 id="page-title">ບັນຊາການເຊັກອິນ</h1>
            <p id="page-sub">ລາຍງານການເຂົ້າວຽກລາຍວັນ</p>
            <div class="date-nav">
                <button class="nav-btn" onclick="changeDate(-1)">◀</button>
                <div class="date-info">
                    <div class="date-display" id="current-date"></div>
                    <div class="day-display" id="current-day"></div>
                </div>
                <button class="nav-btn" onclick="changeDate(1)">▶</button>
            </div>
        </div>
        <div class="summary-bar" id="summary-bar">
            <span class="s-item"><span class="s-dot full"></span><span id="s-full">0</span> <span id="s-full-label">ມື້ເຕັມ</span></span>
            <span class="s-item"><span class="s-dot half"></span><span id="s-half">0</span> <span id="s-half-label">ມື້ຄ້າງ</span></span>
            <span class="s-item"><span class="s-dot absent"></span><span id="s-absent">0</span> <span id="s-absent-label">ບໍ່ມາ</span></span>
        </div>
        <div class="worker-list" id="worker-list"></div>
        <div class="save-bar">
            <button class="save-btn" id="save-btn" onclick="saveRecord()">
                <span id="save-label">ບັນທຶກ</span>
            </button>
        </div>
        <div class="admin-link"><a href="admin.html" id="admin-link-text">📊 ແຜງຄວບຄຸມ</a></div>
    </div>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
