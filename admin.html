<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ແຜງຄວບຄຸມ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin">
        <div class="lang-bar">
            <button class="lang-btn active" data-lang="lo" onclick="setLang('lo')">ລາວ</button>
            <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
        </div>
        <div class="admin-header">
            <h1 id="admin-title">📊 ແຜງຄວບຄຸມ</h1>
            <p id="admin-sub">ສະຫຼຸບການເຊັກອິນລາຍເດືອນ</p>
            <div class="month-nav">
                <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                <div class="month-label" id="month-label"></div>
                <button class="nav-btn" onclick="changeMonth(1)">▶</button>
            </div>
        </div>
        <div class="month-stats" id="month-stats"></div>
        <div class="summary-table-wrap">
            <table class="summary-table" id="summary-table">
                <thead><tr id="table-head"></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        <div class="day-detail" id="day-detail">
            <h3 id="detail-title">ລາຍລະອຽດ</h3>
            <div id="detail-body"></div>
        </div>
        <div class="export-bar">
            <button class="export-btn" onclick="exportCSV()">📥 ສົ່ງອອກ CSV</button>
            <a href="index.html" class="export-btn secondary" id="back-link">📋 ກັບໄປເຊັກອິນ</a>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
