<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຫນ້າຈໍຄຸ້ມຄອງ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f7fa;color:#333;max-width:480px;margin:0 auto;padding:16px}
.hdr{text-align:center;padding:20px 0}
.hdr h1{font-size:20px}
.hdr p{font-size:13px;color:#888}
.lang{position:fixed;top:12px;right:12px;background:#2563eb;color:white;border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;z-index:99}
.mnav{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}
.mnav button{background:white;border:1px solid #ddd;border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.mnav b{font-size:16px;min-width:100px;text-align:center}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.ms{background:white;border-radius:10px;padding:12px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ms b{display:block;font-size:22px}
.ms small{font-size:11px;color:#888}
.ms.f b{color:#22c55e}
.ms.h b{color:#f59e0b}
.ms.a b{color:#ef4444}
table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
th,td{padding:10px 8px;text-align:center;font-size:13px;border-bottom:1px solid #f0f0f0}
th{background:#f9fafb;font-weight:600;color:#555}
.nm{text-align:left;font-weight:600}
.nm small{font-weight:400;color:#999}
.panel{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.panel h3{font-size:14px;margin-bottom:10px}
.datepick{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.datepick label{font-size:12px;color:#888;white-space:nowrap}
.datepick input[type=date]{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.abtn{flex:1;min-width:0;padding:10px 8px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:sans-serif;white-space:nowrap}
.abtn.green{background:#dcfce7;color:#16a34a}
.abtn.blue{background:#dbeafe;color:#2563eb}
.abtn.purple{background:#ede9fe;color:#7c3aed}
.abtn.orange{background:#ffedd5;color:#ea580c}
.abtn.red{background:#fee2e2;color:#dc2626}
.abtn.cyan{background:#cffafe;color:#0891b2}
.sts{text-align:center;font-size:12px;color:#888;margin-top:8px;min-height:18px}
.blk{text-align:center;padding:8px 0}
.blk a{color:#2563eb;text-decoration:none;font-size:14px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#2563eb;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<button class="lang" id="LB" onclick="toggleLang()">中文</button>
<div class="hdr"><h1 id="HT"></h1><p id="HP"></p></div>
<div class="mnav"><button onclick="cm(-1)">◀</button><b id="ML"></b><button onclick="cm(1)">▶</button></div>
<div class="mstats" id="MS"></div>
<table><thead><tr id="TH"></tr></thead><tbody id="TB"></tbody></table>
<div class="panel">
<h3 id="P1T"></h3>
<div class="datepick">
<label id="LBL1"></label><input type="date" id="D1">
<label id="LBL2"></label><input type="date" id="D2">
</div>
<div class="btn-row">
<button class="abtn green" id="BEXP" onclick="expRange()"></button>
<button class="abtn blue" id="BMON" onclick="expMonth()"></button>
</div>
</div>
<div class="panel">
<h3 id="P2T"></h3>
<div class="btn-row">
<button class="abtn purple" id="BBKP" onclick="bkpAll()"></button>
<button class="abtn orange" id="BIMP" onclick="document.getElementById('FI').click()"></button>
<button class="abtn red" id="BCLR" onclick="clrData()"></button>
<button class="abtn cyan" id="BSYNC" onclick="pullGitHub()"></button>
</div>
<input type="file" class="file-input" id="FI" accept=".json" onchange="impFile(this)" style="display:none">
</div>
<div class="sts" id="ST"></div>
<div class="blk"><a href="v2.html" id="BLNK"></a></div>
<script>
var REPO='guocheng1378/attendance-tracker',RAW='https://raw.githubusercontent.com/'+REPO+'/main/data.json';
var E=[{id:1,n:'ໂອນ',z:'盘'},{id:2,n:'ມູ',z:'姆'},{id:3,n:'ຣິມ',z:'松'},{id:4,n:'ບາວ',z:'巴'},{id:5,n:'ຊົງ',z:'恩'},{id:6,n:'ຈົງ',z:'乐昂'},{id:7,n:'ເບີນ',z:'文'},{id:8,n:'ຕົງ',z:'米'},{id:9,n:'ຈົງ',z:'拽'},{id:10,n:'ກິນ',z:'春'},{id:11,n:'ຄົງ',z:'研'},{id:12,n:'ມົວ',z:'罗'}];
var y,m,AR=[],lang='lo',allData=[];
var TXT={
lo:{title:'📊 ຫນ້າຈໍຄຸ້ມຄອງ',sub:'ລາຍງານການເຊັນເຂົ້າລາຍເດືອນ',records:'ບັນທຶກ',full:'ທັງມື້',half:'ປາກສາ',abs:'ບໍ່ມາ',colName:'ຊື່',colTotal:'ລວມ',langBtn:'中文',yr:'ປີ',mo:'ເດືອນ',backBtn:'📋 ກັບຄືນໄປເຊັນເຂົ້າ',
title1:'📅 ສົ່ງອອກຕາມຊ່ວງວັນທີ່',lbl1:'ຈາກ:',lbl2:'ຫາ:',btnExport:'📥 CSV',btnMonth:'📥 ເດືອນນີ້',
title2:'💾 ຈັດການຂໍ້ມູນ',btnBackup:'📦 ສຳຮອງ',btnImport:'📤 ນຳເຂົ້າ',btnClear:'🗑️ ລຶບ',btnSync:'☁️ ດຶງຈາກ GitHub',
loading:'<span class="spinner"></span>ກຳລັງໂຫຼດ...',ok:'✅ ສຳເລັດ',err:'❌ ມີຂໍ້ຜິດພາດ',confirmClr:'ຕ້ອງການລຶບທັງໝົດ?',pullOk:'✅ ດຶງແລ້ວ'},
zh:{title:'📊 管理后台',sub:'月度考勤汇总',records:'记录',full:'全天',half:'半天',abs:'缺勤',colName:'姓名',colTotal:'共',langBtn:'LOA',yr:'年',mo:'月',backBtn:'📋 返回签到',
title1:'📅 按时间导出',lbl1:'从:',lbl2:'到:',btnExport:'📥 导出CSV',btnMonth:'📥 导出本月',
title2:'💾 数据管理',btnBackup:'📦 备份',btnImport:'📤 导入',btnClear:'🗑️ 清空',btnSync:'☁️ 从GitHub拉取',
loading:'<span class="spinner"></span>加载中...',ok:'✅ 完成',err:'❌ 出错',confirmClr:'确定要清空所有数据吗？',pullOk:'✅ 已拉取'}
};
function toggleLang(){lang=(lang==='lo')?'zh':'lo';localStorage.setItem('att_lang',lang);ui();render();}
function ui(){var t=TXT[lang];document.getElementById('LB').textContent=t.langBtn;
document.getElementById('HT').textContent=t.title;document.getElementById('HP').textContent=t.sub;
document.getElementById('BLNK').textContent=t.backBtn;
document.getElementById('P1T').textContent=t.title1;document.getElementById('LBL1').textContent=t.lbl1;document.getElementById('LBL2').textContent=t.lbl2;
document.getElementById('BEXP').textContent=t.btnExport;document.getElementById('BMON').textContent=t.btnMonth;
document.getElementById('P2T').textContent=t.title2;document.getElementById('BBKP').textContent=t.btnBackup;
document.getElementById('BIMP').textContent=t.btnImport;document.getElementById('BCLR').textContent=t.btnClear;
document.getElementById('BSYNC').textContent=t.btnSync;}
function init(){var d=new Date();y=d.getFullYear();m=d.getMonth();var dd=new Date(y,m,1);var de=new Date(y,m+1,0);
document.getElementById('D1').value=fmt(dd);document.getElementById('D2').value=fmt(de);}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function cm(d){m+=d;if(m>11){m=0;y++;}if(m<0){m=11;y--;}var dd=new Date(y,m,1);var de=new Date(y,m+1,0);
document.getElementById('D1').value=fmt(dd);document.getElementById('D2').value=fmt(de);render();}
function render(){var t=TXT[lang];document.getElementById('ML').textContent=y+' '+t.mo+' '+(m+1);
var src=allData.length>0?allData:[];
if(src.length===0){try{src=JSON.parse(localStorage.getItem('att2'));}catch(e){}if(!src)src=[];}
var ym=y+'-'+String(m+1).padStart(2,'0');
AR=src.filter(function(x){return x.d>=ym+'-01'&&x.d<=ym+'-31';});
var ws={};E.forEach(function(e){ws[e.id]={n:e.n,z:e.z,f:0,h:0,a:0};});
AR.forEach(function(r){if(r.w&&ws[r.w])ws[r.w][r.s]++;});
var tf=0,th=0,ta=0;Object.values(ws).forEach(function(w){tf+=w.f;th+=w.h;ta+=w.a;});
document.getElementById('MS').innerHTML='<div class="ms"><b>'+AR.length+'</b><small>'+t.records+'</small></div><div class="ms f"><b>'+tf+'</b><small>'+t.full+'</small></div><div class="ms h"><b>'+th+'</b><small>'+t.half+'</small></div><div class="ms a"><b>'+ta+'</b><small>'+t.abs+'</small></div>';
document.getElementById('TH').innerHTML='<th>'+t.colName+'</th><th>✅ '+t.full+'</th><th>⚠️ '+t.half+'</th><th>❌ '+t.abs+'</th><th>'+t.colTotal+'</th>';
var tb='';Object.values(ws).forEach(function(w){var tt=w.f*1+w.h*0.5;tb+='<tr><td class="nm">'+w.n+'<br><small>'+w.z+'</small></td><td>'+w.f+'</td><td>'+w.h+'</td><td>'+w.a+'</td><td>'+tt+'</td></tr>';});
document.getElementById('TB').innerHTML=tb;}
function getSrc(){var s=allData.length>0?allData:[];if(s.length===0){try{s=JSON.parse(localStorage.getItem('att2'));}catch(e){}if(!s)s=[];}return s;}
function expRange(){var t=TXT[lang];var d1=document.getElementById('D1').value;var d2=document.getElementById('D2').value;if(!d1||!d2)return;
var s=getSrc().filter(function(x){return x.d>=d1&&x.d<=d2;});dlCSV(s,'attendance_'+d1+'_'+d2+'.csv',t);}
function expMonth(){var t=TXT[lang];var ym=y+'-'+String(m+1).padStart(2,'0');
var s=getSrc().filter(function(x){return x.d>=ym+'-01'&&x.d<=ym+'-31';});dlCSV(s,'attendance_'+ym+'.csv',t);}
function dlCSV(data,name,t){if(data.length===0){alert('No data');return;}
var sm={f:t.full,h:t.half,a:t.abs};
var csv='\uFEFFວັນທີ່,ຊື່,ຊື່ຈີນ,ສະຖານະ\n';
data.forEach(function(r){csv+=r.d+','+r.n+','+r.z+','+sm[r.s]+'\n';});
var b=new Blob([csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
function bkpAll(){var s=getSrc();if(s.length===0){alert('No data');return;}
var b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='attendance_backup_'+fmt(new Date())+'.json';a.click();}
function impFile(el){var f=el.files[0];if(!f)return;var r=new FileReader();
r.onload=function(e){try{var d=JSON.parse(e.target.result);if(!Array.isArray(d)){alert('Invalid');return;}
var s=getSrc().concat(d);localStorage.setItem('att2',JSON.stringify(s));allData=s;render();
document.getElementById('ST').textContent=TXT[lang].ok+' ('+d.length+')';setTimeout(function(){document.getElementById('ST').textContent='';},3000);
}catch(e){alert('Parse error');}};r.readAsText(f);el.value='';}
function clrData(){if(!confirm(TXT[lang].confirmClr))return;
localStorage.removeItem('att2');allData=[];render();document.getElementById('ST').textContent=TXT[lang].ok;}
function pullGitHub(){var t=TXT[lang];var st=document.getElementById('ST');st.innerHTML=t.loading;
fetch(RAW+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){allData=d;localStorage.setItem('att2',JSON.stringify(d));render();st.textContent=t.pullOk;setTimeout(function(){st.textContent='';},2000);}).catch(function(){st.textContent=t.err;});}
lang=localStorage.getItem('att_lang')||'lo';init();ui();pullGitHub();
</script>
</body>
</html>
