<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考勤工资核算</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f7fa;color:#333;max-width:480px;margin:0 auto;padding:16px}
.hdr{text-align:center;padding:16px 0}
.hdr h1{font-size:20px}
.hdr p{font-size:13px;color:#888}
.hint{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:12px;padding:10px 12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:12px}
.hint b{color:#2563eb}
.today{background:#eff6ff;border:1px solid #dbeafe;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.today b{font-size:18px;color:#2563eb}
.panel{background:white;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.panel h3{font-size:14px;margin-bottom:10px}
.adv-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.adv-form select,.adv-form input{padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.adv-form .full{grid-column:1/3;padding:10px;background:#7c3aed;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.alist{max-height:180px;overflow-y:auto;border-top:1px solid #f0f0f0;padding-top:8px}
.aitem{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:#f9fafb;border-radius:8px;margin-bottom:4px;font-size:12px}
.aitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aitem button{padding:3px 8px;border:none;border-radius:6px;font-size:11px;cursor:pointer;background:#fee2e2;color:#dc2626}
table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
th,td{padding:9px 5px;text-align:center;font-size:12px;border-bottom:1px solid #f0f0f0}
th{background:#f9fafb;font-weight:600;color:#555}
.nm{text-align:left;font-weight:600}
.nm small{font-weight:400;color:#999}
.tot{font-weight:700;background:#f8fafc}
.rule{margin-top:10px;font-size:11px;color:#888;background:white;border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ref{margin-top:10px;font-size:11px;color:#888;text-align:center}
.ref a{color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<div class="hdr"><h1>💵 考勤工资核算</h1><p id="SUB"></p></div>
<div class="hint"><span>统计月份</span><b id="YM"></b><span>应出勤天数</span><b id="DEN"></b><span>记录天数</span><b id="REC"></b></div>
<div class="today" id="TODAY"></div>

<div class="panel">
<h3>💰 本月预支记录（提前借钱）</h3>
<div class="adv-form">
<select id="AW"></select>
<input id="AA" type="number" min="0" step="1000" placeholder="金额（如 500000）">
<input id="AD" type="date">
<button class="full" onclick="addAdv()">➕ 记录预支</button>
</div>
<div class="alist" id="AL"></div>
</div>

<table><thead><tr id="TH"></tr></thead><tbody id="TB"></tbody></table>
<div class="rule" id="RULE"></div>
<div class="ref"><a href="v2.html">去签到</a> · <a href="admin-v2.html">管理后台</a></div>
<script>
var REPO='guocheng1378/attendance-tracker',API='https://api.github.com/repos/'+REPO+'/contents/backup',RAW='https://raw.githubusercontent.com/'+REPO+'/main/backup/';
var E=[{w:1,z:'盘',n:'ໂອນ'},{w:2,z:'姆',n:'ມູ'},{w:3,z:'松',n:'ຣິມ'},{w:4,z:'巴',n:'ບາວ'},{w:5,z:'恩',n:'ຊົງ'},{w:6,z:'乐昂',n:'ຈົງ'},{w:7,z:'文',n:'ເບີນ'},{w:8,z:'米',n:'ຕົງ'},{w:9,z:'拽',n:'ຈົງ'},{w:10,z:'春',n:'ກິນ'},{w:11,z:'研',n:'ຄົງ'},{w:12,z:'罗',n:'ມົວ'}];
// id -> [总工资, 奖金]；眼=研(id11)
var PAY={1:[4500000,0],2:[4000000,500000],3:[4000000,0],4:[4000000,0],5:[4000000,0],6:[4000000,0],7:[4000000,0],8:[4000000,0],9:[4500000,500000],10:[4500000,500000],11:[4000000,300000],12:[4000000,0]};
var ADVKEY='att_advance';
var data=[],curYM='',curDenom=0;
function loadLocal(){try{var s=JSON.parse(localStorage.getItem('att2')||'[]');if(s.length)return s;}catch(e){}return null;}
function latestBackup(cb){fetch(API).then(function(r){return r.json();}).then(function(files){
  var jsons=(files||[]).filter(function(f){return f.name&&f.name.endsWith('.json');});
  if(!jsons.length){cb(null);return;}
  jsons.sort(function(a,b){return a.name<b.name?-1:1;});
  var latest=jsons[jsons.length-1].name;
  fetch(RAW+latest).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){cb(j);}).catch(function(){cb(null);});
}).catch(function(){cb(null);});}
function daysInMonth(y,m){return new Date(y,m,0).getDate();} // m 1-based
function fmt(n){n=Math.round(n);return n.toLocaleString('en-US');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getAdv(){try{var a=JSON.parse(localStorage.getItem(ADVKEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function saveAdv(a){localStorage.setItem(ADVKEY,JSON.stringify(a));}
function advFor(ym){var a=getAdv();var m={};E.forEach(function(e){m[e.w]=0;});a.forEach(function(x){if(x.d&&x.d.slice(0,7)===ym&&m[x.w]!=null)m[x.w]+=Number(x.amount)||0;});return m;}
function fillAvail(){
  var s=document.getElementById('AW');s.innerHTML='';
  E.forEach(function(e){var o=document.createElement('option');o.value=e.w;o.textContent=e.z+' '+e.n;s.appendChild(o);});
}
function renderAdvList(){
  var box=document.getElementById('AL');
  var a=getAdv().filter(function(x){return x.d&&x.d.slice(0,7)===curYM;}).sort(function(x,y){return x.d<y.d?-1:1;});
  if(!a.length){box.innerHTML='<div style="padding:6px;color:#888;font-size:12px">本月暂无预支记录</div>';return;}
  var html='';a.forEach(function(x){var e=E.filter(function(q){return q.w===x.w;})[0];var nm=e?e.z:'#'+x.w;
    html+='<div class="aitem"><span>'+x.d+' · '+nm+' · '+fmt(x.amount)+'</span><button onclick="delAdv(\''+x.id+'\')">删</button></div>';});
  box.innerHTML=html;
}
function addAdv(){
  var w=+document.getElementById('AW').value;
  var amt=Number(document.getElementById('AA').value);
  var d=document.getElementById('AD').value||todayStr();
  if(!amt||amt<0){alert('请输入正确金额');return;}
  var a=getAdv();a.push({id:Date.now()+'_'+Math.random().toString(36).slice(2,6),d:d,w:w,amount:amt});saveAdv(a);
  document.getElementById('AA').value='';renderAdvList();build();
}
function delAdv(id){var a=getAdv().filter(function(x){return String(x.id)!==String(id);});saveAdv(a);renderAdvList();build();}
function build(){
  var dates=[...new Set(data.map(function(r){return r.d;}))].sort();
  var last=dates[dates.length-1];
  var ym=last.slice(0,7); curYM=ym; var py=+ym.slice(0,4), pm=+ym.slice(5,7);
  var denom=daysInMonth(py,pm); curDenom=denom;
  var ws={};E.forEach(function(e){ws[e.w]={f:0,h:0,a:0};});
  data.forEach(function(r){if(r.d.indexOf(ym)===0&&ws[r.w]){if(r.s==='f')ws[r.w].f++;else if(r.s==='h')ws[r.w].h++;else if(r.s==='a')ws[r.w].a++;}});
  var adv=advFor(ym);
  var dr=data.filter(function(r){return r.d===last;});
  var df=dr.filter(function(r){return r.s==='f';}).length,dh=dr.filter(function(r){return r.s==='h';}).length,da=dr.filter(function(r){return r.s==='a';}).length;
  document.getElementById('YM').textContent=ym+'（'+pm+'月）';
  document.getElementById('DEN').textContent=denom+' 天';
  document.getElementById('REC').textContent=dates.length+' 天';
  document.getElementById('TODAY').innerHTML='今日('+last+') 出勤：<b>'+(df+dh)+'</b> 人 · 全天 '+df+' · 半天 '+dh+' · 缺勤 '+da;
  document.getElementById('TH').innerHTML='<th>姓名</th><th>全天</th><th>半天</th><th>缺勤</th><th>折算</th><th>应发工资</th><th>应发奖金</th><th>预支</th><th>实发</th>';
  var tb='',sumS=0,sumB=0,sumA=0,sumN=0;
  E.forEach(function(e){var w=ws[e.w],p=PAY[e.w];var d=w.f+w.h*0.5;
    var sal=Math.round((p[0]/denom)*d);var bon=Math.round((p[1]/denom)*d);var ad=adv[e.w]||0;var net=sal+bon-ad;
    sumS+=sal;sumB+=bon;sumA+=ad;sumN+=net;
    tb+='<tr><td class="nm">'+e.z+'<br><small>'+e.n+'</small></td><td>'+w.f+'</td><td>'+w.h+'</td><td>'+w.a+'</td><td>'+(d%1===0?d:d.toFixed(1))+'</td><td>'+fmt(sal)+'</td><td>'+fmt(bon)+'</td><td>'+fmt(ad)+'</td><td>'+fmt(net)+'</td></tr>';});
  tb+='<tr class="tot"><td class="nm">合计</td><td></td><td></td><td></td><td></td><td>'+fmt(sumS)+'</td><td>'+fmt(sumB)+'</td><td>'+fmt(sumA)+'</td><td>'+fmt(sumN)+'</td></tr>';
  document.getElementById('TB').innerHTML=tb;
  document.getElementById('RULE').textContent='规则：应出勤天数=当月天数；出勤折算=全天×1+半天×0.5；应发工资=总工资÷当月天数×出勤折算；应发奖金=奖金÷当月天数×出勤折算；实发=应发工资+应发奖金−本月预支。';
  renderAdvList();
}
function main(){
  document.getElementById('AD').value=todayStr();fillAvail();
  var auto=loadLocal();
  if(auto){data=auto;build();}
  else{document.getElementById('SUB').textContent='加载中…';latestBackup(function(j){
    if(j){data=j;build();}else{document.getElementById('SUB').textContent='⚠️ 暂无数据，请先在签到页保存考勤。';}
  });}
}
main();
</script>
</body>
</html>
